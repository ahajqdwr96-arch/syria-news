<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شبكة سوريا نيوز 🇸🇾</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f3f4f6;
    font-family:Arial,Tahoma,sans-serif;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:25px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    color:#d1d5db;
}

nav{
    background:#1f2937;
    padding:12px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
}

.container{
    max-width:1000px;
    margin:25px auto;
    padding:0 15px;
}

.news-list{
    display:grid;
    gap:20px;
}

.news-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px #0001;
}

.news-card img{
    width:100%;
    max-height:400px;
    object-fit:cover;
    display:block;
}

.news-body{
    padding:20px;
}

.category{
    color:#b91c1c;
    font-weight:bold;
    margin-bottom:8px;
}

.news-title{
    font-size:23px;
    line-height:1.5;
    margin:8px 0;
}

.meta{
    color:#6b7280;
    font-size:14px;
    margin:10px 0;
}

.news-content{
    font-size:17px;
    line-height:1.9;
    white-space:pre-wrap;
    margin-top:12px;
}

.read-more{
    display:inline-block;
    margin-top:18px;
    background:#b91c1c;
    color:white;
    text-decoration:none;
    padding:11px 18px;
    border-radius:8px;
    font-weight:bold;
}

.read-more:hover{
    background:#991b1b;
}

video{
    width:100%;
    max-height:500px;
    margin-top:15px;
    border-radius:10px;
}

audio{
    width:100%;
    margin-top:15px;
}

.loading{
    text-align:center;
    padding:40px;
    background:white;
    border-radius:12px;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:20px;
    border-radius:10px;
}

footer{
    margin-top:40px;
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
}

footer a{
    color:#60a5fa;
}
</style>
</head>

<body>

<header>
    <h1>🇸🇾 شبكة سوريا نيوز</h1>
    <p>صوت الحق والواقع</p>
</header>

<nav>
    <a href="index.html">الرئيسية</a>

    <a href="https://t.me/suryainternetniuz" target="_blank">
        قناتنا على تيليجرام
    </a>
</nav>

<div class="container">

    <div id="news">
        <div class="loading">
            ⏳ جاري تحميل الأخبار...
        </div>
    </div>

</div>

<footer>
    <p>شبكة سوريا نيوز 🇸🇾</p>
    <p>صوت الحق والواقع</p>
</footer>

<script>

async function loadNews(){

    const container =
        document.getElementById("news");

    try{

        const response =
            await fetch(
                "news.json?time=" + Date.now()
            );

        if(!response.ok){

            throw new Error(
                "تعذر تحميل الأخبار."
            );

        }

        const news =
            await response.json();

        if(!Array.isArray(news) || news.length === 0){

            container.innerHTML = `
                <div class="loading">
                    لا توجد أخبار منشورة حالياً.
                </div>
            `;

            return;
        }

        let html = `
            <div class="news-list">
        `;

        news.slice(0, 20).forEach(item => {

            let date = "";

            if(item.created_at){

                date =
                    new Date(
                        item.created_at
                    ).toLocaleString(
                        "ar-SY"
                    );
            }

            let imageHTML = "";

            if(item.image){

                imageHTML = `
                    <img
                        src="${item.image}"
                        alt="صورة الخبر"
                    >
                `;
            }

            let videoHTML = "";

            if(item.video){

                videoHTML = `
                    <video controls>
                        <source src="${item.video}">
                        متصفحك لا يدعم تشغيل الفيديو.
                    </video>
                `;
            }

            let audioHTML = "";

            if(item.audio){

                audioHTML = `
                    <audio controls>
                        <source src="${item.audio}">
                        متصفحك لا يدعم تشغيل الصوت.
                    </audio>
                `;
            }

            html += `

                <article class="news-card">

                    ${imageHTML}

                    <div class="news-body">

                        <div class="category">
                            ${item.category || "سوريا"}
                        </div>

                        <h2 class="news-title">
                            ${item.title || ""}
                        </h2>

                        <div class="meta">

                            ${
                                item.location
                                ? "📍 " + item.location
                                : ""
                            }

                            ${
                                item.source
                                ? " | ✍️ " + item.source
                                : ""
                            }

                            ${
                                date
                                ? " | 🕐 " + date
                                : ""
                            }

                        </div>

                        <div class="news-content">
                            ${
                                item.content || ""
                            }
                        </div>

                        ${videoHTML}

                        ${audioHTML}

                        <a
                            class="read-more"
                            href="article.html?id=${encodeURIComponent(item.id)}"
                        >
                            📰 قراءة الخبر كاملة
                        </a>

                    </div>

                </article>

            `;

        });

        html += `
            </div>
        `;

        container.innerHTML = html;

    }catch(error){

        container.innerHTML = `
            <div class="error">
                ❌ حدث خطأ أثناء تحميل الأخبار.
                <br><br>
                ${error.message}
            </div>
        `;

    }

}

loadNews();

</script>

</body>
</html>
