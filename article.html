<script>

async function loadArticle(){

    const container =
        document.getElementById("article");

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");

    if(!id){

        container.innerHTML = `
            <div class="error">
                ❌ لم يتم تحديد الخبر.
            </div>
        `;

        return;
    }

    try{

        const response =
            await fetch(
                "news.json?time=" + Date.now()
            );

        if(!response.ok){

            throw new Error(
                "تعذر تحميل الأخبار."
            );

        }

        const data = await response.json();
        const news = Array.isArray(data) ? data :
            (Array.isArray(data.news) ? data.news : []);
        const item = news.find(
            n => String(n.id) === String(id)
        );

        if(!item){

            container.innerHTML = `
                <div class="error">
                    ❌ الخبر غير موجود.
                </div>
            `;

            return;
        }

        let date = "";

        if(item.created_at){

            date =
                new Date(
                    item.created_at
                ).toLocaleString(
                    "ar-SY"
                );
        }

        let imageHTML = "";

        if(item.image){

            imageHTML = `
                <img
                    src="${item.image}"
                    alt="صورة الخبر"
                >
            `;
        }

        let videoHTML = "";

        if(item.video){

            videoHTML = `
                <video controls>
                    <source src="${item.video}">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            `;
        }

        let audioHTML = "";

        if(item.audio){

            audioHTML = `
                <audio controls>
                    <source src="${item.audio}">
                    متصفحك لا يدعم تشغيل الصوت.
                </audio>
            `;
        }

        container.innerHTML = `

            <article class="article">

                <div class="category">
                    ${item.category || "سوريا"}
                </div>

                <h2>
                    ${item.title || ""}
                </h2>

                <div class="meta">
                    ${item.location ? "📍 " + item.location : ""}
                    ${item.source ? " | ✍️ " + item.source : ""}
                    ${date ? " | 🕐 " + date : ""}
                </div>

                ${imageHTML}

                <div class="content">
                    ${item.content || ""}
                </div>

                ${videoHTML}

                ${audioHTML}

            </article>

        `;

        document.title =
            (item.title || "الخبر") +
            " - شبكة سوريا نيوز";

    }catch(error){

        container.innerHTML = `
            <div class="error">
                ❌ حدث خطأ أثناء تحميل الخبر.
                <br><br>
                ${error.message}
            </div>
        `;
    }
}

loadArticle();

</script>
