<!DOCTYPE html>

<head>

<title>لوحة نشر الأخبار - شبكة سوريا نيوز</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f3f5;
    color:#222;
}

header{
    background:#111827;
    color:white;
    padding:22px;
    text-align:center;
}

header h1{
    margin:0 0 8px;
    font-size:25px;
}

header p{
    margin:0;
    opacity:.85;
}

.container{
    max-width:800px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:17px;
    margin-bottom:7px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    font-family:inherit;
    outline:none;
}

textarea{
    min-height:220px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:9px;
    background:#111827;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#111827;
    text-decoration:none;
}

#status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    background:#ecfdf5;
    color:#166534;
}
</style>
</head>

</header>
