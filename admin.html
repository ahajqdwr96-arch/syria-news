<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة نشر الأخبار - شبكة سوريا نيوز</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    background:#eef1f5;
    font-family:Arial,Tahoma,sans-serif;
}

.container{
    max-width:750px;
    margin:auto;
}

.box{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-top:0;
    color:#111;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    background:white;
}

textarea{
    min-height:200px;
    resize:vertical;
}

.file-box{
    margin-top:15px;
    padding:15px;
    background:#f7f8fa;
    border-radius:12px;
    border:1px solid #ddd;
}

.file-box input{
    margin-top:8px;
    padding:8px;
}

.preview{
    margin-top:10px;
    max-width:100%;
    border-radius:10px;
}

button{
    width:100%;
    border:0;
    padding:15px;
    margin-top:18px;
    border-radius:11px;
    font-size:17px;
    font-weight:bold;
    background:#1683ff;
    color:white;
}

button:disabled{
    background:#888;
}

.clear{
    background:#555;
}

.status{
    margin-top:15px;
    padding:14px;
    border-radius:10px;
    background:#f0f0f0;
    white-space:pre-wrap;
}

.note{
    margin-top:10px;
    font-size:13px;
    color:#666;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>📰 شبكة سوريا نيوز 🇸🇾</h1>

<label>🔐 GitHub Token</label>
<input
    id="token"
    type="password"
    placeholder="ضع GitHub Token هنا"
>

<label>📰 عنوان الخبر</label>
<input
    id="title"
    type="text"
    placeholder="اكتب عنوان الخبر"
>

<label>🏷️ تصنيف الخبر</label>
<select id="category">
    <option value="عاجل">🔴 عاجل</option>
    <option value="سوريا">🇸🇾 سوريا</option>
    <option value="حرب">⚔️ حرب</option>
    <option value="أمن">🛡️ أمن</option>
    <option value="سياسة">🏛️ سياسة</option>
    <option value="اقتصاد">💰 اقتصاد</option>
    <option value="دولي">🌍 دولي</option>
    <option value="محلي">📍 محلي</option>
</select>

<label>📍 المكان</label>
<input
    id="location"
    type="text"
    placeholder="مثال: حلب - ريف حلب"
>

<label>✍️ المصدر / الكاتب</label>
<input
    id="source"
    type="text"
    placeholder="مثال: شبكة سوريا نيوز"
>

<label>📝 نص الخبر</label>
<textarea
    id="content"
    placeholder="اكتب نص الخبر هنا..."
></textarea>

<div class="file-box">

    <b>🖼️ الصورة الرئيسية</b>

    <input
        id="imageFile"
        type="file"
        accept="image/*"
        onchange="previewImage()"
    >

    <img
        id="imagePreview"
        class="preview"
        style="display:none"
    >

</div>

<div class="file-box">

    <b>🎥 الفيديو</b>

    <input
        id="videoFile"
        type="file"
        accept="video/*"
    >

</div>

<div class="file-box">

    <b>🎙️ المقطع الصوتي</b>

    <input
        id="audioFile"
        type="file"
        accept="audio/*"
    >

</div>

<button
    id="publishButton"
    onclick="publishNews()"
>
🚀 نشر الخبر
</button>

<button
    class="clear"
    onclick="clearForm()"
>
🗑️ مسح الحقول
</button>

<div
    id="status"
    class="status"
>
جاهز للنشر.
</div>

<div class="note">
شبكة سوريا نيوز 🇸🇾
</div>

</div>
</div>

<script>

const CLOUD_NAME = "hagyoalb";
const UPLOAD_PRESET = "syria_news";

const GITHUB_REPO = "ahajqdwr96-arch/syria-news";
const NEWS_FILE = "news.json";


function status(message){

    document.getElementById("status").textContent = message;

}


function previewImage(){

    const file =
        document.getElementById("imageFile").files[0];

    const preview =
        document.getElementById("imagePreview");

    if(!file){

        preview.style.display = "none";

        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        preview.src = e.target.result;

        preview.style.display = "block";

    };

    reader.readAsDataURL(file);
}


async function uploadCloudinary(file,type){

    if(!file){

        return "";
    }

    let resourceType = "image";

    if(type === "video" || type === "audio"){

        resourceType = "video";

    }

    const url =
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;

    const formData = new FormData();

    formData.append("file",file);

    formData.append(
        "upload_preset",
        UPLOAD_PRESET
    );

    const response = await fetch(
        url,
        {
            method:"POST",
            body:formData
        }
    );

    if(!response.ok){

        const errorText =
            await response.text();

        throw new Error(
            "فشل رفع الملف:\n" +
            errorText
        );

    }

    const data =
        await response.json();

    return data.secure_url;
}


async function getNews(token){

    const url =
        `https://api.github.com/repos/${GITHUB_REPO}/contents/${NEWS_FILE}`;

    const response = await fetch(
        url,
        {
            headers:{
                "Authorization":
                    `Bearer ${token}`,

                "Accept":
                    "application/vnd.github+json",

                "X-GitHub-Api-Version":
                    "2022-11-28"
            }
        }
    );

    if(response.status === 404){

        return {
            news:[],
            sha:null
        };

    }

    if(!response.ok){

        const error =
            await response.text();

        throw new Error(
            "تعذر قراءة الأخبار من GitHub:\n" +
            error
        );

    }

    const data =
        await response.json();

    const binary =
        atob(
            data.content.replace(/\n/g,"")
        );

    const bytes =
        Uint8Array.from(
            binary,
            c => c.charCodeAt(0)
        );

    const text =
        new TextDecoder("utf-8")
        .decode(bytes);

    let news =
        JSON.parse(text);

    if(!Array.isArray(news)){

        news = [];

    }

    return {
        news:news,
        sha:data.sha
    };
}


async function saveNews(
    token,
    news,
    sha
){

    const url =
        `https://api.github.com/repos/${GITHUB_REPO}/contents/${NEWS_FILE}`;

    const json =
        JSON.stringify(
            news,
            null,
            2
        );

    const bytes =
        new TextEncoder()
        .encode(json);

    let binary = "";

    for(const byte of bytes){

        binary +=
            String.fromCharCode(byte);

    }

    const encoded =
        btoa(binary);

    const body = {

        message:
            "نشر خبر جديد",

        content:
            encoded,

        branch:
            "main"

    };

    if(sha){

        body.sha = sha;

    }

    const response =
        await fetch(
            url,
            {
                method:"PUT",

                headers:{

                    "Authorization":
                        `Bearer ${token}`,

                    "Accept":
                        "application/vnd.github+json",

                    "X-GitHub-Api-Version":
                        "2022-11-28",

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(body)
            }
        );

    if(!response.ok){

        const error =
            await response.text();

        throw new Error(error);

    }

    return true;
}


async function publishNews(){

    const button =
        document.getElementById(
            "publishButton"
        );

    const token =
        document.getElementById(
            "token"
        ).value.trim();

    const title =
        document.getElementById(
            "title"
        ).value.trim();

    const category =
        document.getElementById(
            "category"
        ).value;

    const location =
        document.getElementById(
            "location"
        ).value.trim();

    const source =
        document.getElementById(
            "source"
        ).value.trim();

    const content =
        document.getElementById(
            "content"
        ).value.trim();

    const imageFile =
        document.getElementById(
            "imageFile"
        ).files[0];

    const videoFile =
        document.getElementById(
            "videoFile"
        ).files[0];

    const audioFile =
        document.getElementById(
            "audioFile"
        ).files[0];


    if(!token){

        status("❌ ضع GitHub Token أولاً.");

        return;
    }

    if(!title){

        status("❌ اكتب عنوان الخبر.");

        return;
    }

    if(!content){

        status("❌ اكتب نص الخبر.");

        return;
    }


    button.disabled = true;

    try{

        let image = "";
        let video = "";
        let audio = "";


        if(imageFile){

            status(
                "⏳ جاري رفع الصورة..."
            );

            image =
                await uploadCloudinary(
                    imageFile,
                    "image"
                );
        }


        if(videoFile){

            status(
                "⏳ جاري رفع الفيديو..."
            );

            video =
                await uploadCloudinary(
                    videoFile,
                    "video"
                );
        }


        if(audioFile){

            status(
                "⏳ جاري رفع المقطع الصوتي..."
            );

            audio =
                await uploadCloudinary(
                    audioFile,
                    "audio"
                );
        }


        status(
            "⏳ جاري قراءة الأخبار..."
        );

        const result =
            await getNews(token);


        const newsItem = {

            id:
                Date.now(),

            title:
                title,

            content:
                content,

            category:
                category,

            location:
                location,

            source:
                source,

            image:
                image,

            video:
                video,

            audio:
                audio,

            created_at:
                new Date().toISOString()

        };


        result.news.unshift(
            newsItem
        );


        status(
            "⏳ جاري نشر الخبر على الموقع..."
        );


        await saveNews(
            token,
            result.news,
            result.sha
        );


        status(
            "✅ تم نشر الخبر بنجاح."
        );


        clearForm(false);


    }catch(error){

        status(
            "❌ حدث خطأ:\n\n" +
            error.message
        );

    }finally{

        button.disabled = false;

    }

}


function clearForm(showMessage = true){

    document.getElementById(
        "title"
    ).value = "";

    document.getElementById(
        "location"
    ).value = "";

    document.getElementById(
        "source"
    ).value = "";

    document.getElementById(
        "content"
    ).value = "";

    document.getElementById(
        "imageFile"
    ).value = "";

    document.getElementById(
        "videoFile"
    ).value = "";

    document.getElementById(
        "audioFile"
    ).value = "";

    document.getElementById(
        "imagePreview"
    ).style.display = "none";


    if(showMessage){

        status(
            "تم مسح الحقول."
        );

    }

}

</script>
