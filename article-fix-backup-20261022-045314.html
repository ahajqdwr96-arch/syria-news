<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الخبر - شبكة سوريا نيوز 🇸🇾</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f3f4f6;
    font-family:Arial,Tahoma,sans-serif;
    color:#111;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
}

header p{
    margin:8px 0 0;
    color:#d1d5db;
}

nav{
    background:#1f2937;
    text-align:center;
    padding:12px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.article{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px #0001;
}

.category{
    color:#b91c1c;
    font-weight:bold;
}

h2{
    font-size:28px;
    line-height:1.5;
}

.meta{
    color:#666;
    font-size:14px;
    margin:12px 0;
}

.article img,
.article video{
    width:100%;
    max-height:600px;
    object-fit:contain;
    border-radius:10px;
    margin:15px 0;
}

.article audio{
    width:100%;
    margin:15px 0;
}

.content{
    font-size:18px;
    line-height:2;
    white-space:pre-wrap;
}

.loading{
    text-align:center;
    padding:30px;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:20px;
    border-radius:10px;
}

footer{
    margin-top:40px;
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
}

footer a{
    color:#60a5fa;
}

/* الهوية البصرية الموحدة */
body {
    background: #f3f4f6;
    color: #171717;
    line-height: 1.9;
}
header {
    background: linear-gradient(125deg, #101010, #25231e 70%, #111);
    border-bottom: 4px solid #c9a75b;
    padding: 28px 16px;
}
header h1 {
    color: #ead7a2;
    font-size: clamp(25px, 5vw, 35px);
}
header p {
    color: #d6d1c6;
}
nav {
    background: #202020;
    border-bottom: 1px solid #c9a75b;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
}
nav a {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 6px;
    margin: 0;
    transition: background .2s, color .2s;
}
nav a:hover {
    background: #c9a75b;
    color: #151515;
}
.container {
    max-width: 1000px;
    margin: 32px auto;
}
.article {
    padding: clamp(18px, 4vw, 38px);
    border: 1px solid #e5e1d8;
    border-top: 4px solid #c9a75b;
    border-radius: 14px;
    box-shadow: 0 10px 32px #1717170c;
}
.category {
    display: inline-block;
    padding: 4px 12px;
    color: #85631e;
    background: #f8f0dd;
    border: 1px solid #eadbb7;
    border-radius: 6px;
}
.article h2 {
    margin: 14px 0;
    color: #171717;
    font-size: clamp(25px, 5vw, 36px);
    line-height: 1.65;
}
.meta {
    padding: 10px 0 15px;
    margin-bottom: 16px;
    border-bottom: 1px solid #e8e3da;
    line-height: 2;
}
.article img,
.article video {
    display: block;
    max-width: 100%;
    background: #ececec;
    border-radius: 12px;
}
.content {
    color: #292929;
    font-size: clamp(17px, 2.5vw, 20px);
    line-height: 2.15;
    overflow-wrap: anywhere;
}
.article audio {
    display: block;
    max-width: 100%;
}
footer {
    border-top: 4px solid #c9a75b;
}
footer a {
    color: #ead7a2;
}
@media (max-width: 600px) {
    .container {
        margin: 18px auto;
        padding: 0 12px;
    }
    .article {
        padding: 18px;
        border-radius: 10px;
    }
    .article h2 {
        font-size: 25px;
    }
    nav {
        gap: 3px;
        padding: 10px 5px;
    }
    nav a {
        margin: 0;
        padding: 7px 9px;
        font-size: 14px;
    }
}

</style>
</head>

<body>

<header>
<h1>🇸🇾 شبكة سوريا نيوز</h1>
<p>صوت الحق والواقع</p>
</header>

<nav>
<a href="index.html">الرئيسية</a>
<a href="news.html">الأخبار</a>
<a href="https://t.me/suryainternetniuz" target="_blank">
قناتنا على تيليجرام
</a>
</nav>

<div class="container">

<div id="article">
<div class="loading">
⏳ جاري تحميل الخبر...
</div>
</div>

</div>

<footer>
<p>شبكة سوريا نيوز 🇸🇾</p>
<p>صوت الحق والواقع</p>
</footer>

<script>

async function loadArticle(){

    const container =
        document.getElementById("article");

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");

    if(!id){

        container.innerHTML = `
            <div class="error">
                ❌ لم يتم تحديد الخبر.
            </div>
        `;

        return;
    }

    try{

        const response =
            await fetch(
                "news.json?time=" + Date.now()
            );

        if(!response.ok){

            throw new Error(
                "تعذر تحميل الأخبار."
            );

        }

        const news =
            await response.json();

        const item =
            news.find(
                n => String(n.id) === String(id)
            );

        if(!item){

            container.innerHTML = `
                <div class="error">
                    ❌ الخبر غير موجود.
                </div>
            `;

            return;
        }

        let date = "";

        if(item.created_at){

            date =
                new Date(
                    item.created_at
                ).toLocaleString(
                    "ar-SY"
                );
        }

        let imageHTML = "";

        if(item.image){

            imageHTML = `
                <img
                    src="${item.image}"
                    alt="صورة الخبر"
                >
            `;
        }

        let videoHTML = "";

        if(item.video){

            videoHTML = `
                <video controls>
                    <source src="${item.video}">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            `;
        }

        let audioHTML = "";

        if(item.audio){

            audioHTML = `
                <audio controls>
                    <source src="${item.audio}">
                    متصفحك لا يدعم تشغيل الصوت.
                </audio>
            `;
        }

        container.innerHTML = `

            <article class="article">

                <div class="category">
                    ${item.category || "سوريا"}
                </div>

                <h2>
                    ${item.title || ""}
                </h2>

                <div class="meta">
                    ${item.location ? "📍 " + item.location : ""}
                    ${item.source ? " | ✍️ " + item.source : ""}
                    ${date ? " | 🕐 " + date : ""}
                </div>

                ${imageHTML}

                <div class="content">
                    ${item.content || ""}
                </div>

                ${videoHTML}

                ${audioHTML}

            </article>

        `;

        document.title =
            (item.title || "الخبر") +
            " - شبكة سوريا نيوز";

    }catch(error){

        container.innerHTML = `
            <div class="error">
                ❌ حدث خطأ أثناء تحميل الخبر.
                <br><br>
                ${error.message}
            </div>
        `;
    }
}

loadArticle();

</script>

</body>
</html>
