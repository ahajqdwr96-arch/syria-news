<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة نشر الأخبار - شبكة سوريا نيوز</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f3f5;
    color:#222;
}

header{
    background:#111827;
    color:white;
    padding:22px;
    text-align:center;
}

header h1{margin:0 0 8px}
header p{margin:0;opacity:.85}

.container{
    max-width:800px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-top:17px;
    margin-bottom:7px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    font-family:inherit;
}

textarea{
    min-height:220px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:9px;
    background:#111827;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

#status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
}

.success{
    background:#ecfdf5;
    color:#166534;
}

.error{
    background:#fef2f2;
    color:#991b1b;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#111827;
    text-decoration:none;
}
</style>
</head>

<body>

<header>

</header>

    <option value="سوريا">سوريا</option>
    <option value="حلب">حلب</option>
    <option value="إدلب">إدلب</option>
    <option value="أخبار عامة">أخبار عامة</option>
</select>

<textarea id="content" placeholder="اكتب نص الخبر هنا..."></textarea>

<input id="image" type="url" placeholder="https://...">
