}

body {

}

header {
    background: #111827;

    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;

}

}

    border-radius: 15px;

}

    display: block;
    margin-top: 15px;

}

    width: 100%;
    padding: 13px;

    border-radius: 9px;

    min-height: 220px;
    resize: vertical;
}

    padding: 14px;

    border-radius: 9px;
    background: #111827;
    color: white;
    font-size: 17px;
    cursor: pointer;
}
